<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic maison saine</title>
<meta name="robots" content="noindex">
<style>
  :root {
      --bg: #FFFFFF;
      --bg-soft: #eaf8fb;
      --surface: #FFFFFF;
      --text: #051c21;
      --muted: #4e7984;
      --border: #ddebee;
      --primary: #0F766E;
      --primary-dark: #00645d;
      --primary-light: #d6eeea;
      --primary-50: #e3fbf8;
      --secondary: #2C5761;
      --secondary-dark: #1b4750;
      --accent: #6E3F4C;
      --accent-light: #f5e3e7;
      --cta: #0F766E;
      --cta-hover: #00645d;
      --cta-text: #FFFFFF;
      --option-border: #b8d3da;
      --option-hover: #e3fbf8;
      --option-selected: #0F766E;
      --progress: #0F766E;
      --progress-track: #ddebee;
      --error: #754552;
    --font-headline: 'Space Grotesk', sans-serif;
    --font-body: 'Source Sans 3', sans-serif;
    --radius: 4px;
    --maxw: 640px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--font-headline); font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: 1.728rem; line-height: 1.15; }
  h2 { font-size: 1.44rem; line-height: 1.2; }
  h3 { font-size: 1.2rem; line-height: 1.25; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 16px 16px 48px; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 20px; }
  .brand { font-family: var(--font-headline); font-weight: 700; font-size: 0.833rem; color: var(--secondary); letter-spacing: 0.02em; }
  .progress { height: 4px; background: var(--progress-track); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--progress); transition: width .25s ease; }
  .screen { display: none; flex: 1; }
  .screen.active { display: block; }

  /* Intro */
  .intro { padding-top: 8px; }
  .kicker { display: inline-block; font-family: var(--font-headline); font-size: 0.833rem; color: var(--primary); background: var(--primary-50); padding: 4px 10px; border-radius: var(--radius); margin-bottom: 16px; }
  .intro h1 { margin-bottom: 14px; }
  .intro .sub { font-size: 1.2rem; color: var(--muted); margin-bottom: 22px; }
  .bullets { list-style: none; padding: 0; margin: 0 0 26px; display: grid; gap: 10px; }
  .bullets li { display: flex; gap: 12px; align-items: flex-start; font-size: 1rem; }
  .bullets li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 7px; background: var(--primary); border-radius: 2px; }
  .img-slot { min-height: 180px; background: linear-gradient(135deg, var(--primary-50), var(--primary-light)); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
  .img-slot.has-img { height: auto !important; min-height: 0 !important; background: transparent !important; padding: 0 !important; display: block !important; }
  .img-slot.has-img img { width: 100%; height: auto; object-fit: contain; display: block; }
  .img-slot:empty:not(.has-img) { display: none; }
  .img-slot.show-placeholder:empty { display: block; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 15px 20px; background: var(--cta); color: var(--cta-text); border: 0; border-radius: var(--radius); font-family: var(--font-headline); font-size: 1.2rem; font-weight: 700; cursor: pointer; text-decoration: none; transition: background .15s; }
  .btn:hover { background: var(--cta-hover); }
  .btn:focus-visible, .opt:focus-visible, input:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }
  .meta { text-align: center; font-size: 0.833rem; color: var(--muted); margin-top: 10px; }

  /* Questions */
  .step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; min-height: 28px; }
  .step-num { font-family: var(--font-headline); font-size: 0.833rem; color: var(--muted); margin-left: auto; }
  .back { background: none; border: 0; color: var(--muted); font-family: var(--font-body); font-size: 0.833rem; cursor: pointer; padding: 4px 0; }
  .back::before { content: "\2190\00a0"; }
  .q-title { margin-bottom: 20px; }
  .opts { display: grid; gap: 10px; }
  .opt { width: 100%; text-align: left; padding: 15px 16px; background: var(--surface); color: var(--text); border: 1.5px solid var(--option-border); border-radius: var(--radius); font-family: var(--font-body); font-size: 1rem; line-height: 1.4; cursor: pointer; transition: background .12s, border-color .12s; }
  .opt:hover { background: var(--option-hover); border-color: var(--primary); }
  .opt.selected { background: var(--option-selected); border-color: var(--option-selected); color: var(--cta-text); }

  /* Gate */
  .gate h2 { margin-bottom: 10px; }
  .gate .sub { color: var(--muted); margin-bottom: 22px; font-size: 1.2rem; }
  .field { margin-bottom: 12px; }
  .field input { width: 100%; padding: 14px 14px; border: 1.5px solid var(--option-border); border-radius: var(--radius); font-family: var(--font-body); font-size: 1rem; color: var(--text); background: var(--surface); }
  .field input:focus { border-color: var(--primary); }
  .error { color: var(--error); font-size: 0.833rem; margin: -4px 0 12px; min-height: 1.2em; }
  .gate .btn { margin-top: 6px; }

  /* Result */
  .result .kicker { margin-bottom: 10px; }
  .result h2 { font-size: 1.728rem; margin-bottom: 12px; }
  .result .txt { font-size: 1.2rem; margin-bottom: 22px; }
  .guide { border: 1.5px solid var(--border); border-left: 4px solid var(--primary); border-radius: var(--radius); padding: 16px; margin-bottom: 18px; background: var(--bg-soft); }
  .guide.alerte { border-left-color: var(--accent); }
  .guide .lbl { font-size: 0.833rem; color: var(--muted); margin-bottom: 4px; }
  .guide h3 { margin-bottom: 8px; }
  .guide .note { font-size: 0.833rem; color: var(--muted); }
  .guide .img-slot { margin: 12px 0 0; min-height: 0; }
  .result .btn { margin-top: 6px; }
  .restart { display: block; text-align: center; margin-top: 16px; font-size: 0.833rem; color: var(--muted); background: none; border: 0; cursor: pointer; font-family: var(--font-body); width: 100%; }
  .disclaimer { font-size: 0.694rem; color: var(--muted); margin-top: 22px; }
  footer { margin-top: auto; padding-top: 32px; font-size: 0.694rem; color: var(--muted); text-align: center; }

  @media (min-width: 720px) {
    .wrap { padding: 32px 24px 64px; }
    h1 { font-size: 2.488rem; }
    h2 { font-size: 1.728rem; }
    .result h2 { font-size: 2.074rem; }
    .opt { font-size: 1.2rem; padding: 17px 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script src="config.js"></script>
<script src="tracker.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.FUNNEL_CONFIG || {};
  var LIVE = CFG;
  var QUESTION_COUNT = 31;

  function deepMerge(base, over) {
    var out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    Object.keys(over || {}).forEach(function (k) {
      var v = over[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && base && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        out[k] = deepMerge(base[k], v);
      } else if (v !== undefined && v !== null) {
        out[k] = v;
      }
    });
    return out;
  }

  function loadFonts(fonts) {
    var link = document.createElement('link');
    link.href = 'https://fonts.googleapis.com/css2?family=' + fonts.headline.replace(/ /g, '+') + ':wght@400;700&family=' + fonts.body.replace(/ /g, '+') + ':wght@400;600;700&display=swap';
    link.rel = 'stylesheet';
    document.head.appendChild(link);
  }

  function applyConfig(cfg) {
    LIVE = cfg;
    var root = document.documentElement;
    Object.keys(cfg.colors || {}).forEach(function (k) { root.style.setProperty(k, cfg.colors[k]); });
    if (cfg.fonts) {
      root.style.setProperty('--font-headline', "'" + cfg.fonts.headline + "', sans-serif");
      root.style.setProperty('--font-body', "'" + cfg.fonts.body + "', sans-serif");
      loadFonts(cfg.fonts);
    }
    Object.keys(cfg.texts || {}).forEach(function (k) {
      var el = document.getElementById(k);
      if (el) el.innerHTML = cfg.texts[k];
    });
    Object.keys(cfg.images || {}).forEach(function (key) {
      var url = cfg.images[key];
      var slot = document.getElementById('img-' + key);
      if (!slot) return;
      if (url) { slot.classList.add('has-img'); slot.innerHTML = '<img src="' + url + '" alt="" loading="lazy">'; }
      else { slot.classList.remove('has-img'); slot.innerHTML = ''; }
    });
    var intro = document.getElementById('img-introHero');
    if (intro && !intro.classList.contains('has-img')) intro.style.display = 'none'; else if (intro) intro.style.display = '';
    document.querySelectorAll('a[data-cta]').forEach(function (a) { a.href = cfg.ctaUrl || '#'; });
    document.getElementById('lead-firstname').placeholder = (cfg.texts || {}).gateFirstName || '';
    document.getElementById('lead-email').placeholder = (cfg.texts || {}).gateEmail || '';
    applyQuestionVisibility(cfg);
  }

  function enabledQuestions(cfg, path) {
    var en = cfg.questionsEnabled || {};
    var qs = ((cfg.quiz || {}).paths || {})[path];
    if (!qs) return [];
    return qs.questions.filter(function (q) { return en[q.key] !== false; });
  }

  function applyQuestionVisibility(cfg) {
    var en = cfg.questionsEnabled || {};
    document.querySelectorAll('[data-step]').forEach(function (step) {
      var key = step.getAttribute('data-step');
      step.setAttribute('data-enabled', (key === 'q0' || en[key] !== false) ? '1' : '0');
    });
  }

  // ---------- state ----------
  var state = { path: null, order: [], idx: -1, answers: [], score: 0, started: false };

  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function setProgress(n, total) {
    var wrap = document.getElementById('quiz-progress-wrap');
    var fill = document.getElementById('quiz-progress-fill');
    var pg = document.getElementById('quiz-progress');
    wrap.style.display = (n > 0) ? 'block' : 'none';
    fill.style.width = Math.round((n / total) * 100) + '%';
    pg.max = total; pg.value = n;
  }

  function totalSteps() {
    return 1 + (state.path ? enabledQuestions(LIVE, state.path).length : 6);
  }

  function showStep(key, n) {
    var total = totalSteps();
    var step = document.getElementById('step-' + key);
    var num = step.querySelector('.step-num');
    var tpl = (LIVE.texts || {}).progressLabel || 'Question {n} sur {total}';
    num.textContent = tpl.replace('{n}', n).replace('{total}', total);
    var back = step.querySelector('[data-back]');
    if (back) back.textContent = (LIVE.texts || {}).backLabel || 'Retour';
    step.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected'); });
    setProgress(n, total);
    show('step-' + key);
  }

  function start() {
    state = { path: null, order: [], idx: -1, answers: [], score: 0, started: true };
    window.FunnelTracker && window.FunnelTracker.track('quiz_start', {});
    showStep('q0', 1);
  }

  function answer(key, optIndex, btn) {
    var step = document.getElementById('step-' + key);
    step.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
    var label = btn.textContent;

    if (key === 'q0') {
      var pathKey = LIVE.quiz.q0.opts[optIndex - 1].path;
      state.path = pathKey;
      state.order = enabledQuestions(LIVE, pathKey).map(function (q) { return q.key; });
      state.idx = -1;
      state.answers = [{ q: 'q0', opt: optIndex, tag: 'segment=' + LIVE.quiz.paths[pathKey].segment, pts: 0, label: label }];
      state.score = 0;
      window.FunnelTracker && window.FunnelTracker.track('quiz_answer', { question: 'q0', answer: label, option: optIndex, path: pathKey });
    } else {
      var qdef = LIVE.quiz.paths[state.path].questions.filter(function (q) { return q.key === key; })[0];
      var o = qdef.opts[optIndex - 1];
      state.answers = state.answers.filter(function (a) { return a.q !== key; });
      state.answers.push({ q: key, opt: optIndex, tag: o.tag, pts: o.pts, label: label });
      state.score = state.answers.reduce(function (s, a) { return s + (a.pts || 0); }, 0);
      window.FunnelTracker && window.FunnelTracker.track('quiz_answer', { question: key, answer: label, option: optIndex, tag: o.tag, path: state.path });
    }
    setTimeout(next, 180);
  }

  function next() {
    state.idx++;
    if (state.idx < state.order.length) {
      showStep(state.order[state.idx], state.idx + 2);
    } else {
      window.FunnelTracker && window.FunnelTracker.track('quiz_complete', { path: state.path, score: state.score });
      setProgress(totalSteps(), totalSteps());
      show('screen-gate');
    }
  }

  function back() {
    if (state.idx <= 0) { state.idx = -1; showStep('q0', 1); return; }
    state.idx--;
    showStep(state.order[state.idx], state.idx + 2);
  }

  function level() {
    var th = (LIVE.quiz && LIVE.quiz.scoreThreshold) || 8;
    return state.score >= th ? 'alerte' : 'vigilant';
  }

  var gateFailures = 0;
  function submitGate() {
    var name = document.getElementById('lead-firstname').value.trim();
    var email = document.getElementById('lead-email').value.trim();
    var hp = document.getElementById('lead-website').value;
    var err = document.getElementById('gate-error');
    var T = LIVE.texts || {};
    if (!name) { err.textContent = T.gateErrorName || ''; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { err.textContent = T.gateErrorEmail || ''; return; }
    err.textContent = '';
    var lv = level();
    var seg = LIVE.quiz.paths[state.path].segment;
    var payload = {
      funnel_id: LIVE.funnelId, visitor_id: (window.FunnelTracker && window.FunnelTracker.visitorId) || null,
      prenom: name, email: email, segment: seg, niveau: lv, score: state.score,
      answers: state.answers, page_url: location.href, website: hp
    };
    var btn = document.getElementById('gateButton');
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = T.gateSending || label;
    var reset = function () { btn.disabled = false; btn.textContent = label; };
    var succeed = function () {
      window.FunnelTracker && window.FunnelTracker.track('lead', { segment: seg, niveau: lv, score: state.score, path: state.path });
      window.FunnelTracker && window.FunnelTracker.track('conversion', { segment: seg, niveau: lv });
      reset(); showResult(lv);
    };
    var fail = function (reason) {
      gateFailures++;
      window.FunnelTracker && window.FunnelTracker.track('lead_error', { reason: String(reason).substring(0, 120), attempt: gateFailures });
      if (gateFailures >= 2) { reset(); showResult(lv); return; }
      reset(); err.textContent = T.gateErrorServer || '';
    };
    var base = (LIVE.apiBase || '').replace(/\/$/, '');
    fetch(base + '/api/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    }).then(function (r) {
      if (r.ok) return succeed();
      return r.json().then(function (j) { fail(j && j.error ? j.error : ('http ' + r.status)); }).catch(function () { fail('http ' + r.status); });
    }).catch(function (e) { fail(e && e.message ? e.message : 'network'); });
  }

  function showResult(lv) {
    var T = LIVE.texts || {};
    var P = state.path.toUpperCase();
    var L = lv.charAt(0).toUpperCase() + lv.slice(1);
    document.getElementById('result-name').innerHTML = T['result' + P + L + 'Name'] || '';
    document.getElementById('result-text').innerHTML = T['result' + P + L + 'Text'] || '';
    document.getElementById('result-guide').innerHTML = T['result' + P + L + 'Guide'] || '';
    var box = document.getElementById('result-guide-box');
    box.classList.toggle('alerte', lv === 'alerte');
    var cover = document.getElementById('result-cover');
    var url = (LIVE.images || {})['guideCover' + P];
    if (url) { cover.classList.add('has-img'); cover.innerHTML = '<img src="' + url + '" alt="" loading="lazy">'; cover.style.display = ''; }
    else { cover.classList.remove('has-img'); cover.innerHTML = ''; cover.style.display = 'none'; }
    setProgress(0, 1);
    show('screen-result');
  }

  // ---------- events ----------
  document.getElementById('introCta').addEventListener('click', start);
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.opt');
    if (opt) { answer(opt.getAttribute('data-q'), parseInt(opt.getAttribute('data-opt'), 10), opt); return; }
    if (e.target.closest('[data-back]')) { back(); return; }
    if (e.target.closest('[data-restart]')) { start(); return; }
  });
  document.getElementById('gateButton').addEventListener('click', submitGate);
  document.getElementById('lead-email').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitGate(); });

  // ---------- config load (override serveur, sinon config.js) ----------
  var base0 = (CFG.apiBase || '').replace(/\/$/, '');
  var applied = false;
  var fallback = setTimeout(function () { if (!applied) { applied = true; applyConfig(CFG); } }, 2500);
  fetch(base0 + '/api/config?funnel_id=' + encodeURIComponent(CFG.funnelId), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (applied) return; applied = true; clearTimeout(fallback); applyConfig(j && j.config ? deepMerge(CFG, j.config) : CFG); })
    .catch(function () { if (applied) return; applied = true; clearTimeout(fallback); applyConfig(CFG); });
})();
</script>
